name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-121:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Test and vet core
        env:
          GOWORK: "off"
        run: |
          go test -race ./...
          go vet ./...

  test:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/chrisuzor/apperr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Authenticate git for this private module
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Test and vet core
        run: |
          go test -race ./...
          go vet ./...
      - name: Test and vet apperrgin
        working-directory: apperrgin
        run: |
          go test -race ./...
          go vet ./...
